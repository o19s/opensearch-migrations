# Apply the backup via kubectl apply -n ma -f backup-simple.yaml
apiVersion: solr.apache.org/v1beta1
kind: SolrBackup
metadata:
  name: backup-simple
  namespace: ma
spec:
  repositoryName: "localstack-s3" # Repository to use, should match value from SolrCloud CR
  solrCloud: solr-source # name of the solr cluster used in SolrCloud CR
  #collections: # When omitted, all collections are included
  #  - techproducts
  #  - foodproducts
