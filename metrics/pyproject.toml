[project]
name = "migration-tui"
version = "0.1.0"
description = "Terminal dashboard for OpenSearch Migration Assistant capture/replay validation"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "textual>=0.89.1",
    "httpx>=0.28.1",
    "boto3>=1.35.0",
    "click>=8.1.7",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "textual-dev>=1.7.0",
]

[project.scripts]
migration-tui = "migration_tui.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_tui"]
